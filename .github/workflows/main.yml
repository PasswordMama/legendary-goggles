name: Build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.0

      - name: Extract zip(s) and locate the project
        id: proj
        run: |
          set -e
          mkdir -p _extracted
          i=0
          while IFS= read -r -d '' z; do
            i=$((i+1))
            echo "Extracting: $z"
            unzip -o -q "$z" -d "_extracted/$i"
          done < <(find . -iname "*.zip" -not -path "./.git/*" -not -path "./_extracted/*" -print0)

          # Prefer a project found inside an extracted zip, otherwise use loose files in the repo
          f=$(find _extracted -name build.gradle -not -path "*/node_modules/*" 2>/dev/null | head -n1 || true)
          if [ -z "$f" ]; then
            f=$(find . -name build.gradle -not -path "./.git/*" -not -path "./_extracted/*" | head -n1 || true)
          fi
          if [ -z "$f" ]; then
            echo "No build.gradle found. Upload the mod zip (or its files) to the repo."
            exit 1
          fi
          d=$(dirname "$f")
          echo "Project folder: $d"
          echo "dir=$d" >> "$GITHUB_OUTPUT"

      - name: Build
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: |
            ${{ steps.proj.outputs.dir }}/build/libs/*.jar
            !${{ steps.proj.outputs.dir }}/build/libs/*-sources.jar
          if-no-files-found: error
